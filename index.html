<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today</title>
<style>
  :root {
    --bg: #191919;
    --ink: #e6e6e6;
    --muted: #9b9b9b;
    --accent: #7b9bff;
    --edge: #2f2f2f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    overflow: hidden; background: var(--bg);
  }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center;
  }
  .block {
    --s: min(calc(100vw - 8px), calc(100vh - 8px));
    width: var(--s); height: var(--s);
    border: 1px solid var(--edge); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: var(--ink);
  }
  .weekday { font-size: calc(var(--s) * 0.1); font-weight: 600; color: var(--accent); }
  .day { font-size: calc(var(--s) * 0.4); font-weight: 700; line-height: 1.05; letter-spacing: -0.03em; }
  .month { font-size: calc(var(--s) * 0.09); color: var(--muted); }
</style>
</head>
<body>
  <div class="block" id="block"></div>
<script>
  const LOCALE = "";

  function render() {
    const now = new Date();
    const loc = LOCALE || undefined;
    document.getElementById("block").innerHTML =
      `<div class="weekday">${now.toLocaleDateString(loc, { weekday: "long" })}</div>
       <div class="day">${now.getDate()}</div>
       <div class="month">${now.toLocaleDateString(loc, { month: "long", year: "numeric" })}</div>`;
  }
  render();

  function scheduleMidnight() {
    const n = new Date();
    const next = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 0, 1);
    setTimeout(() => { render(); scheduleMidnight(); }, next - n);
  }
  scheduleMidnight();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
</script>
</body>
</html>
